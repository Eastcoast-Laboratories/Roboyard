plugins {
    id 'com.android.application'
    id 'org.jetbrains.compose' version '1.9.3'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.10'
}

// Thin Android application wrapper around the Compose Multiplatform UI in
// :composeApp so it can be installed as an APK next to the original Android app.
android {
    namespace 'de.z11.roboyard.compose'
    compileSdk 36

    defaultConfig {
        applicationId 'de.z11.roboyard.compose'
        minSdk 23 // kermit (shared logging) requires 23
        targetSdk 36
        versionCode 60
        versionName '60'
    }

    buildFeatures {
        buildConfig true
    }

    // Same lint setup as the app module: shared strings have pre-existing
    // ExtraTranslation entries (e.g. "reset", "robot_count")
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildTypes {
        release {
            // Debug signing for now (same as the app module)
            signingConfig signingConfigs.debug
        }
    }

    sourceSets {
        main.res.srcDir("${buildDir}/generated/res/shared")
    }
}

// Reuse the Android app's string resources and launcher icons so the Compose
// APK shows identical texts and icon without duplicating them (single source
// of truth: app/src/main/res).
tasks.register('generateSharedResources', Copy) {
    def appRes = "${project(':app').projectDir}/src/main/res"
    from(appRes) {
        include 'values*/strings*.xml'
        include 'mipmap-*/**'
    }
    into "${buildDir}/generated/res/shared"
}
tasks.named('preBuild') { dependsOn 'generateSharedResources' }

dependencies {
    implementation project(':composeApp')
    implementation project(':shared')
    implementation(compose.ui)
    implementation(compose.foundation)
    implementation(compose.material3)
    implementation(compose.runtime)
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'com.jakewharton.timber:timber:5.0.1'
}
