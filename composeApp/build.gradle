plugins {
    id 'org.jetbrains.kotlin.multiplatform'
    id 'org.jetbrains.compose' version '1.9.3'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.10'
    id 'com.android.kotlin.multiplatform.library'
}

// Version of the Compose Multiplatform app (mirrors composeAndroidApp versionName)
version = '60'

kotlin {
    jvmToolchain(17)

    androidLibrary {
        namespace = 'roboyard.composeapp'
        compileSdk = 36
        minSdk = 21
        androidResources {
            enable = true
        }
    }

    jvm("desktop")

    [iosX64(), iosArm64(), iosSimulatorArm64()].each { iosTarget ->
        iosTarget.binaries.framework {
            baseName = 'Roboyard'
            isStatic = false
        }
    }

    sourceSets {
        commonMain {
            dependencies {
                implementation compose.runtime
                implementation compose.foundation
                implementation compose.material3
                implementation compose.ui
                implementation compose.components.resources
                implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0"
                implementation project(':shared')
            }
        }
        commonTest {
            dependencies {
                implementation kotlin("test")
                implementation compose.uiTest
            }
        }
        androidMain {
            dependencies {
                implementation compose.ui
                implementation compose.material3
                implementation compose.foundation
            }
        }
        desktopMain {
            dependencies {
                implementation compose.desktop.currentOs
                implementation "org.jetbrains.kotlinx:kotlinx-coroutines-swing:1.9.0"
                // Bundle the Skiko natives for every OS so the release uber-jar
                // runs on Windows, macOS and Linux alike — currentOs alone only
                // embeds the natives of the machine that built the jar, which
                // makes a Linux-built jar fail on Windows with UnsatisfiedLinkError
                // ("A Java exception has occurred" when double-clicked).
                // Version must match the Skiko version bundled by the Compose
                // plugin (see `desktopRuntimeClasspath` dependencies).
                def skikoVersion = '0.9.22.2'
                implementation "org.jetbrains.skiko:skiko-awt-runtime-windows-x64:$skikoVersion"
                implementation "org.jetbrains.skiko:skiko-awt-runtime-windows-arm64:$skikoVersion"
                implementation "org.jetbrains.skiko:skiko-awt-runtime-linux-x64:$skikoVersion"
                implementation "org.jetbrains.skiko:skiko-awt-runtime-linux-arm64:$skikoVersion"
                implementation "org.jetbrains.skiko:skiko-awt-runtime-macos-x64:$skikoVersion"
                implementation "org.jetbrains.skiko:skiko-awt-runtime-macos-arm64:$skikoVersion"
            }
        }
        desktopTest {
            dependencies {
                implementation kotlin("test")
                implementation compose.uiTestJUnit4
                implementation compose.desktop.currentOs
            }
        }
    }
}

// strings.json (Desktop/iOS texts) is generated from the Android string
// resources (single source of truth: app/src/main/res/values*/strings.xml).
def generateStringsJson = tasks.register('generateStringsJson', Exec) {
    description = 'Generates strings/strings.json from the Android strings.xml files'
    def script = rootProject.file('dev/scripts/sync_strings_json.py')
    inputs.files(fileTree(rootProject.file('app/src/main/res')) { include 'values*/strings.xml' })
    inputs.file(script)
    outputs.file(file('src/commonMain/resources/strings/strings.json'))
    commandLine 'python3', script.absolutePath
}
tasks.matching { it.name.endsWith('ProcessResources') || it.name.endsWith('JavaRes') }.configureEach {
    dependsOn generateStringsJson
}

compose.desktop {
    application {
        mainClass = 'roboyard.MainKt'
        nativeDistributions {
            packageVersion = '60'
        }
    }
}
